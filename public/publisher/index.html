<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>頁面發布工具 — 25SPROUT NBU</title>

    <!-- T004: CSS — 深色調，匹配 NBU Pages 視覺風格 -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      .hidden { display: none !important; }

      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --surface-2: #21262d;
        --border: #30363d;
        --accent: #4f9cf9;
        --accent-hover: #79b4fb;
        --success: #3fb950;
        --error: #f85149;
        --warning: #d29922;
        --text: #e6edf3;
        --text-muted: #8b949e;
        --text-dim: #484f58;
        --radius: 8px;
        --radius-sm: 4px;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.5;
      }

      /* Background glow effects */
      .bg-glow {
        position: fixed; inset: 0; pointer-events: none; z-index: 0;
        overflow: hidden;
      }
      .bg-glow::before {
        content: '';
        position: absolute;
        top: -20%; left: 30%;
        width: 500px; height: 500px;
        background: radial-gradient(circle, rgba(79,156,249,.12) 0%, transparent 70%);
        border-radius: 50%;
      }
      .bg-glow::after {
        content: '';
        position: absolute;
        bottom: 10%; right: 15%;
        width: 400px; height: 400px;
        background: radial-gradient(circle, rgba(63,185,80,.08) 0%, transparent 70%);
        border-radius: 50%;
      }

      /* Layout */
      .page {
        position: relative; z-index: 1;
        max-width: 680px;
        margin: 0 auto;
        padding: 0 24px 80px;
      }

      /* Nav */
      .nav {
        display: flex; align-items: center; gap: 12px;
        padding: 20px 0 40px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 40px;
      }
      .nav-logo {
        font-size: 13px; font-weight: 700; letter-spacing: 0.08em;
        color: var(--text-muted); text-decoration: none;
        text-transform: uppercase;
      }
      .nav-logo:hover { color: var(--text); }
      .nav-sep { color: var(--text-dim); font-size: 13px; }
      .nav-pill {
        background: rgba(79,156,249,.15);
        color: var(--accent);
        border: 1px solid rgba(79,156,249,.3);
        border-radius: 20px;
        padding: 2px 10px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      /* Sections */
      .section { animation: fadeIn .25s ease; }
      .section.hidden { display: none; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

      /* Hero (login screen) */
      .hero { text-align: center; padding: 60px 0 40px; }
      .hero h1 {
        font-size: 28px; font-weight: 700; margin-bottom: 12px;
        background: linear-gradient(135deg, var(--text), var(--text-muted));
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .hero p { color: var(--text-muted); font-size: 15px; margin-bottom: 32px; }

      /* User bar */
      .user-bar {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 20px;
      }
      .user-display {
        font-size: 13px; color: var(--text-muted);
        display: flex; align-items: center; gap: 6px;
      }
      .user-display::before {
        content: '●'; color: var(--success); font-size: 8px;
      }

      /* Card */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 28px;
      }
      .card h2 {
        font-size: 18px; font-weight: 600; margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
      }

      /* Form groups */
      .form-group { margin-bottom: 20px; }
      .form-group label {
        display: block;
        font-size: 13px; font-weight: 600; color: var(--text-muted);
        margin-bottom: 8px; letter-spacing: 0.02em; text-transform: uppercase;
      }
      .form-group .hint { font-weight: 400; text-transform: none; font-size: 12px; }

      /* File input */
      .file-input-wrapper {
        position: relative;
        display: flex; align-items: center;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 10px 14px;
        cursor: pointer;
        transition: border-color .15s;
      }
      .file-input-wrapper:hover { border-color: var(--accent); }
      .file-input-wrapper input[type="file"] {
        position: absolute; inset: 0;
        opacity: 0; cursor: pointer; width: 100%; height: 100%;
      }
      .file-input-label {
        font-size: 14px; color: var(--text-muted);
        pointer-events: none;
        display: flex; align-items: center; gap: 8px;
      }
      .file-input-label .icon { font-size: 16px; }
      #file-name-display {
        font-size: 13px; color: var(--text);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      /* Text input */
      .text-input {
        width: 100%;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 10px 14px;
        color: var(--text);
        font-size: 14px;
        font-family: 'SFMono-Regular', Consolas, monospace;
        transition: border-color .15s;
        outline: none;
      }
      .text-input:focus { border-color: var(--accent); }
      .text-input::placeholder { color: var(--text-dim); }

      /* Validation error */
      .validation-error {
        margin-top: 6px;
        font-size: 12px; color: var(--error);
        display: flex; align-items: center; gap: 4px;
      }
      .validation-error::before { content: '⚠'; }
      .validation-error.hidden { display: none; }

      /* URL preview */
      .url-preview-box {
        background: rgba(79,156,249,.06);
        border: 1px solid rgba(79,156,249,.2);
        border-radius: var(--radius-sm);
        padding: 12px 14px;
        margin-bottom: 20px;
      }
      .url-preview-label {
        font-size: 11px; color: var(--text-muted);
        font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
        display: block; margin-bottom: 4px;
      }
      .url-preview-value {
        font-size: 13px;
        font-family: 'SFMono-Regular', Consolas, monospace;
        color: var(--text-dim);
        word-break: break-all;
      }
      .url-preview-value--active { color: var(--accent); }

      /* Error banner */
      .error-banner {
        background: rgba(248,81,73,.1);
        border: 1px solid rgba(248,81,73,.3);
        border-radius: var(--radius-sm);
        padding: 12px 14px;
        font-size: 13px; color: var(--error);
        margin-bottom: 16px;
        display: flex; align-items: flex-start; gap: 8px;
      }
      .error-banner::before { content: '✕'; flex-shrink: 0; font-weight: 700; }
      .error-banner.hidden { display: none; }

      /* Buttons */
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        padding: 10px 20px;
        border-radius: var(--radius-sm);
        font-size: 14px; font-weight: 600;
        cursor: pointer;
        border: 1px solid transparent;
        transition: background .15s, opacity .15s, border-color .15s;
        text-decoration: none;
      }
      .btn:disabled { opacity: .45; cursor: not-allowed; }
      .btn-primary {
        background: var(--accent);
        color: #0d1117;
      }
      .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
      .btn-secondary {
        background: var(--surface-2);
        color: var(--text);
        border-color: var(--border);
      }
      .btn-secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
      .btn-ghost {
        background: transparent;
        color: var(--text-muted);
        border-color: var(--border);
        font-size: 13px; padding: 6px 12px;
      }
      .btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--text-muted); }
      .btn-full { width: 100%; }

      /* Pipeline status section */
      .pipeline-status {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 20px;
        margin-bottom: 20px;
      }
      .status-row {
        display: flex; align-items: center; gap: 12px;
        margin-bottom: 12px;
      }
      .status-icon { font-size: 20px; flex-shrink: 0; }
      .status-text { font-size: 15px; font-weight: 500; }
      .pipeline-link {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 13px; color: var(--accent);
        text-decoration: none;
      }
      .pipeline-link:hover { color: var(--accent-hover); text-decoration: underline; }
      .pipeline-link.hidden { display: none; }

      /* Success box */
      .success-box {
        background: rgba(63,185,80,.08);
        border: 1px solid rgba(63,185,80,.25);
        border-radius: var(--radius-sm);
        padding: 20px;
        text-align: center;
      }
      .success-box.hidden { display: none; }
      .success-msg {
        font-size: 16px; font-weight: 700; color: var(--success);
        margin-bottom: 12px;
      }
      .deployed-url {
        display: block;
        font-size: 13px; font-family: 'SFMono-Regular', Consolas, monospace;
        color: var(--accent); word-break: break-all;
        text-decoration: none; margin-bottom: 16px;
      }
      .deployed-url:hover { text-decoration: underline; }

      /* Pipeline error box */
      .pipeline-error-box {
        background: rgba(248,81,73,.08);
        border: 1px solid rgba(248,81,73,.25);
        border-radius: var(--radius-sm);
        padding: 16px;
      }
      .pipeline-error-box.hidden { display: none; }
      .error-text { font-size: 13px; color: var(--error); line-height: 1.6; }

      /* CDN warmup countdown */
      .cdn-warmup {
        margin-bottom: 16px;
        display: flex; flex-direction: column; align-items: center; gap: 6px;
      }
      .cdn-timer {
        font-size: 44px; font-weight: 700; color: var(--success);
        line-height: 1.1; font-variant-numeric: tabular-nums;
      }
      .cdn-warmup-note {
        font-size: 13px; color: var(--text-muted);
      }

      @keyframes spin { to { transform: rotate(360deg); } }
      .spinner {
        display: inline-block; width: 13px; height: 13px;
        border: 2px solid currentColor; border-top-color: transparent;
        border-radius: 50%; animation: spin 0.7s linear infinite;
        vertical-align: middle; margin-right: 5px;
      }

      /* Login button hero sizing */
      .btn-hero {
        padding: 14px 36px;
        font-size: 15px;
        border-radius: var(--radius);
      }

      /* ===== T002: 已發布頁面清單 ===== */
      .file-list-section { margin-top: 24px; }
      #file-list-loading,
      #file-list-empty   { font-size: 14px; color: var(--text-muted); padding: 20px 0; text-align: center; }
      #file-list-error   { font-size: 14px; color: var(--error);      padding: 20px 0; text-align: center; }
      #file-list-container {
        max-height: 400px;
        overflow-y: auto;
        margin-top: 4px;
      }
      .file-list-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }
      .file-list-row:last-child { border-bottom: none; }
      .file-list-name {
        font-size: 14px; font-weight: 600;
        flex: 1; min-width: 0;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .file-list-actions { display: flex; gap: 6px; flex-shrink: 0; }
      .btn-icon {
        background: transparent;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 4px 10px;
        font-size: 12px; color: var(--text-muted);
        cursor: pointer;
        transition: border-color .15s, color .15s;
        white-space: nowrap;
      }
      .btn-icon:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
      .btn-icon:disabled { opacity: .4; cursor: not-allowed; }
      .btn-icon--danger:hover:not(:disabled) { border-color: var(--error); color: var(--error); }

      /* ===== T003: 刪除確認 Modal ===== */
      .modal {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        z-index: 200;
      }
      .modal.hidden { display: none; }
      .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.6); }
      .modal-body {
        position: relative; z-index: 1;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 28px;
        min-width: 320px; max-width: 480px; width: 90vw;
      }
      .modal-body p { font-size: 14px; line-height: 1.6; margin-bottom: 24px; color: var(--text); }
      .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

      /* ===== T021: Toast ===== */
      #toast-container {
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
        z-index: 300;
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        pointer-events: none;
      }
      .toast {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 10px 20px; font-size: 13px; color: var(--text);
        animation: toastIn .2s ease; pointer-events: none;
      }
      .toast--success { border-color: rgba(63,185,80,.4); color: var(--success); }
      .toast--error   { border-color: rgba(248,81,73,.4);  color: var(--error); }
      @keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    </style>
  </head>

  <body>
    <!-- Background glow -->
    <div class="bg-glow"></div>

    <div class="page">
      <!-- Nav -->
      <nav class="nav">
        <a href="../" class="nav-logo">25SPROUT NBU</a>
        <span class="nav-sep">/</span>
        <span class="nav-pill">Page Publisher</span>
      </nav>

      <!-- T013, T015, T022: HTML 結構 -->

      <!-- Section: 未登入 -->
      <section id="section-login" class="section">
        <div class="hero">
          <h1>HTML 頁面發布工具</h1>
          <p>使用您的 GitLab 帳號登入，將任意 HTML 頁面快速發布至 NBU Pages。</p>
          <button id="btn-login" class="btn btn-primary btn-hero">以 GitLab 帳號登入</button>
        </div>
        <div id="login-error" class="error-banner hidden"></div>
      </section>

      <!-- Section: 已登入 + 上傳表單 -->
      <section id="section-upload" class="section hidden">
        <div class="user-bar">
          <span id="user-display" class="user-display"></span>
          <button id="btn-logout" class="btn btn-ghost">登出</button>
        </div>

        <div class="card">
          <h2>發布 HTML 頁面</h2>

          <!-- 檔案選擇 -->
          <div class="form-group">
            <label>選擇 HTML 檔案</label>
            <div class="file-input-wrapper">
              <input type="file" id="file-input" accept=".html,.htm" />
              <div class="file-input-label">
                <span class="icon">📄</span>
                <span id="file-name-display">點擊或拖拉 .html / .htm 檔案</span>
              </div>
            </div>
          </div>

          <!-- 檔案名稱 -->
          <div class="form-group">
            <label for="filename-input">
              檔案名稱
              <span class="hint">（僅限英數字、- 和 _，不含副檔名）</span>
            </label>
            <input
              type="text"
              id="filename-input"
              class="text-input"
              placeholder="例：my-page"
              maxlength="100"
              autocomplete="off"
              spellcheck="false"
            />
            <div id="validation-error" class="validation-error hidden"></div>
          </div>

          <!-- URL 預覽 -->
          <div class="url-preview-box">
            <span class="url-preview-label">發布後網址</span>
            <span id="url-preview" class="url-preview-value">請選擇檔案並輸入名稱</span>
          </div>

          <!-- 全域錯誤 -->
          <div id="global-error" class="error-banner hidden"></div>

          <!-- 發布按鈕 -->
          <button id="btn-publish" class="btn btn-primary btn-full" disabled>發布</button>
        </div>

        <!-- T003: 已發布頁面清單 -->
        <div class="file-list-section">
          <div class="card">
            <h2>我的已發布頁面</h2>
            <div id="file-list-loading" class="hidden">載入中…</div>
            <div id="file-list-empty"   class="hidden">尚無已發布的頁面</div>
            <div id="file-list-error"   class="hidden"></div>
            <div id="file-list-container"></div>
          </div>
        </div>
      </section>

      <!-- Section: Pipeline 進度 -->
      <section id="section-pipeline" class="section hidden">
        <div class="user-bar">
          <span id="user-display-pipeline" class="user-display"></span>
        </div>

        <div class="card">
          <h2 id="pipeline-card-title">部署中…</h2>

          <!-- 狀態列 -->
          <div class="pipeline-status">
            <div class="status-row">
              <span class="status-icon" id="status-icon">⏳</span>
              <span id="pipeline-status-text" class="status-text">正在取得 Pipeline 狀態…</span>
            </div>
            <a
              id="pipeline-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="pipeline-link hidden"
            >查看 Pipeline 詳情 →</a>
          </div>

          <!-- 成功：部署網址 -->
          <div id="success-box" class="success-box hidden">
            <p class="success-msg">✓ 部署成功！</p>
            <div id="cdn-warmup" class="cdn-warmup hidden">
              <div class="cdn-timer" id="cdn-timer" style="display:none"></div>
              <p class="cdn-warmup-note" id="cdn-warmup-note">Pages CDN 生效中，請稍候…</p>
            </div>
            <a id="deployed-url" href="#" target="_blank" rel="noopener noreferrer" class="deployed-url"></a>
            <button id="btn-publish-again" class="btn btn-secondary">再次發布</button>
          </div>

          <!-- 失敗 / 取消 / 逾時 -->
          <div id="pipeline-error-box" class="pipeline-error-box hidden">
            <p id="pipeline-error-text" class="error-text"></p>
          </div>
        </div>
      </section>
    </div><!-- /.page -->

    <!-- T003: 刪除確認 Modal -->
    <div id="delete-confirm-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-body">
        <p id="delete-confirm-message"></p>
        <div class="modal-actions">
          <button id="btn-delete-cancel"  class="btn btn-secondary">取消</button>
          <button id="btn-delete-confirm" class="btn btn-secondary" style="border-color:var(--error);color:var(--error);">確認刪除</button>
        </div>
      </div>
    </div>

    <!-- T021: Toast 容器 -->
    <div id="toast-container"></div>

    <script>
      'use strict';

      // ============================================================
      // T002: CONFIG — 所有可設定值集中於此
      // ============================================================
      const CONFIG = Object.freeze({
        GITLAB_BASE_URL:          'https://fox.25sprout.com',
        CLIENT_ID:                '8b950e1648ba376dbdc761e1f750d38bd5cf6f221b53ddda4829156184bfff3c', // OAuth Application ID
        REDIRECT_URI:             'https://public-pages-56dd79.fox.25sprout.com/publisher/',
        PROJECT_PATH:             'nbu%2Fpublic-pages',
        PAGES_BASE_URL:           'https://nbu.fox.25sprout.com/public-pages',
        PIPELINE_POLL_INTERVAL_MS: 8000,   // 8 秒
        PIPELINE_TIMEOUT_MS:      300000,  // 5 分鐘
        PIPELINE_RETRY_INTERVAL_MS: 2000,  // 重試間隔 2 秒
        PIPELINE_RETRY_MAX:       3,       // 最多重試 3 次
        CDN_WARMUP_MS:            10000,     // 10 秒 CDN 生效等待倒數
        PUBLIC_DIR_PREFIX:        'public',
      });

      // ============================================================
      // T003: APP_STATE — App 狀態機常數
      // ============================================================
      const APP_STATE = Object.freeze({
        UNAUTHENTICATED:   'UNAUTHENTICATED',
        OAUTH_CALLBACK:    'OAUTH_CALLBACK',
        AUTHENTICATED:     'AUTHENTICATED',
        UPLOADING:         'UPLOADING',
        POLLING:           'POLLING',
        DEPLOYED:          'DEPLOYED',
        DEPLOYMENT_FAILED: 'DEPLOYMENT_FAILED',
        DEPLOYMENT_TIMEOUT:'DEPLOYMENT_TIMEOUT',
      });

      // ============================================================
      // Module-level 狀態
      // ============================================================
      let currentUser  = null; // { username, name }
      let currentState = APP_STATE.UNAUTHENTICATED;
      let selectedFile = null;
      let selectedFileHash = null;

      // ============================================================
      // T032: URL 路徑編碼工具
      // ============================================================
      function encodeFilePath(path) {
        // 將每個路徑 segment 個別 encodeURIComponent，再以 %2F 連接
        return path.split('/').map(seg => encodeURIComponent(seg)).join('%2F');
      }

      // ============================================================
      // T005: UI 模組
      // ============================================================
      const UI = {
        setState(newState) {
          currentState = newState;
          const loginSection    = document.getElementById('section-login');
          const uploadSection   = document.getElementById('section-upload');
          const pipelineSection = document.getElementById('section-pipeline');

          [loginSection, uploadSection, pipelineSection]
            .forEach(s => s && s.classList.add('hidden'));

          switch (newState) {
            case APP_STATE.UNAUTHENTICATED:
              loginSection && loginSection.classList.remove('hidden');
              // T023: 登出時清空清單
              const fileListContainer = document.getElementById('file-list-container');
              const fileListEmpty     = document.getElementById('file-list-empty');
              if (fileListContainer) fileListContainer.innerHTML = '';
              if (fileListEmpty)     fileListEmpty.classList.add('hidden');
              break;

            case APP_STATE.AUTHENTICATED:
              uploadSection && uploadSection.classList.remove('hidden');
              this._syncUserDisplay('user-display');
              this.clearError();
              this._refreshPublishBtn();
              FileListService.load(); // T012: 載入已發布清單
              break;

            case APP_STATE.UPLOADING:
              // 留在上傳表單內顯示進度
              uploadSection && uploadSection.classList.remove('hidden');

      // ============================================================
      // T006: GitLabAPI 模組
      // ============================================================
      const GitLabAPI = {
        _getToken() {
          return sessionStorage.getItem('gl_token');
        },

        async request(method, path, body = null) {
          const token   = this._getToken();
          const headers = { 'Content-Type': 'application/json' };
          if (token) headers['Authorization'] = `Bearer ${token}`;

          let response;
          try {
            response = await fetch(`${CONFIG.GITLAB_BASE_URL}${path}`, {
              method,
              headers,
              body: body !== null ? JSON.stringify(body) : undefined,
            });
          } catch (_) {
            throw new Error('網路連線異常，請確認網路後重試');
          }

          if (!response.ok) {
            const err = new Error();
            err.status = response.status;
            if (response.status === 401) {
              err.message = '登入已過期，請重新登入'; err.code = 401;
            } else if (response.status === 403) {
              err.message = '權限不足，請聯繫管理員開通發布權限'; err.code = 403;
            } else {
              err.message = `尚無使用權限，請聯絡育賢（Slack: Raguhn Lee）開通使用權限`;
            }
            throw err;
          }

          const text = await response.text();
          return text ? JSON.parse(text) : null;
        },

        // T019: 檢查目標檔案是否存在
        async checkFileExists(filePath) {
          const encodedPath = encodeFilePath(filePath);
          try {
            const data = await this.request(
              'GET',
              `/api/v4/projects/${CONFIG.PROJECT_PATH}/repository/files/${encodedPath}?ref=main`
            );
            return { exists: true, lastCommitId: data.last_commit_id };
          } catch (err) {
            if (err.status === 404) return { exists: false };
            throw err;
          }
        },

        // T020: commit 檔案（建立或更新）
        async commitFile(filePath, base64Content, operation, lastCommitId, username) {
          const encodedPath = encodeFilePath(filePath);
          const filename    = filePath.split('/').pop();
          const body = {
            branch:         'main',
            content:        base64Content,
            encoding:       'base64',
            commit_message: `publish: ${operation} ${username}/${filename}`,
          };
          if (operation === 'update' && lastCommitId) {
            body.last_commit_id = lastCommitId;
          }
          return this.request(
            operation === 'create' ? 'POST' : 'PUT',
            `/api/v4/projects/${CONFIG.PROJECT_PATH}/repository/files/${encodedPath}`,
            body
          );
        },

        // T023: 取得最新 pipeline
        async getLatestPipeline() {
          const data = await this.request(
            'GET',
            `/api/v4/projects/${CONFIG.PROJECT_PATH}/pipelines?ref=main&per_page=1&order_by=id&sort=desc`
          );
          return Array.isArray(data) && data.length > 0 ? data[0] : null;
        },

        // T024: 取得 pipeline 狀態
        async getPipelineStatus(pipelineId) {
          const data = await this.request(
            'GET',
            `/api/v4/projects/${CONFIG.PROJECT_PATH}/pipelines/${pipelineId}`
          );
          return { id: data.id, status: data.status, webUrl: data.web_url, finishedAt: data.finished_at };
        },

        // T004: 列出目錄下的 HTML 檔案（Trees API），依最後更新時間排序
        async listFiles(username) {
          const dirPath = `public/${username}`;
          const encodedPath = encodeURIComponent(dirPath);
          let items = [];
          try {
            const treeData = await this.request(
              'GET',
              `/api/v4/projects/${CONFIG.PROJECT_PATH}/repository/tree?path=${encodedPath}&ref=main&per_page=100`
            );
            items = (Array.isArray(treeData) ? treeData : [])
              .filter(i => i.type === 'blob' && i.name.endsWith('.html'));
          } catch (err) {
            if (err.status === 404) return [];
            throw err;
          }
          if (items.length === 0) return [];

          // 取得 commit 歷史排序（最新 commit 在前）
          try {
            const commits = await this.request(
              'GET',
              `/api/v4/projects/${CONFIG.PROJECT_PATH}/repository/commits?ref=main&path=${encodedPath}&per_page=100`
            );
            if (Array.isArray(commits) && commits.length > 0) {
              const order = [];
              const seen = new Set();
              for (const c of commits) {
                // commit message 格式：publish: create/update {username}/{filename}.html
                const msg = (c.message || c.title || '').split('\n')[0];
                const m = msg.match(/publish:.*\/([^/\s]+\.html)/);
                if (m && !seen.has(m[1])) { seen.add(m[1]); order.push(m[1]); }
              }
              const nameMap = Object.fromEntries(items.map(i => [i.name, i]));
              const sorted  = order.filter(n => nameMap[n]).map(n => nameMap[n]);
              const rest    = items.filter(i => !seen.has(i.name));
              return [...sorted, ...rest];
            }
          } catch (_) {
            // commits 取得失敗，回退為原始順序
          }
          return items;
        },

        // T005: 刪除檔案（Repository Files DELETE）
        async deleteFile(filePath) {
          const encoded = encodeFilePath(filePath);
          try {
            await this.request(
              'DELETE',
              `/api/v4/projects/${CONFIG.PROJECT_PATH}/repository/files/${encoded}`,
              { branch: 'main', commit_message: `remove: ${filePath}` }
            );
          } catch (err) {
            if (err.status === 404) return; // 已被刪除，視為成功
            throw err;
          }
        },

        // T006: 觸發 Pipeline（刪除後重新部署）
        async triggerPipeline() {
          try {
            await this.request('POST', `/api/v4/projects/${CONFIG.PROJECT_PATH}/pipeline`, { ref: 'main' });
          } catch (err) {
            console.warn('[FileList] Pipeline 觸發失敗（刪除操作已完成）:', err.message);
          }
        },
      };

      // ============================================================
      // T007, T018: FileOp 模組
      // ============================================================
      const FileOp = {
        // T007: 驗證檔案與名稱（回傳 null 表示合法；否則回傳中文錯誤訊息）
        validate(file, targetFilename) {
          if (!file) return '請先選擇 HTML 檔案';

          const isHtmlMime = file.type === 'text/html';
          const isHtmlExt  = /\.(html|htm)$/i.test(file.name);
          if (!isHtmlMime && !isHtmlExt) return '僅支援 HTML 檔案（.html 或 .htm）';

          if (file.size > 5 * 1024 * 1024)  return '檔案大小不得超過 5 MB';

          if (!targetFilename || !targetFilename.trim()) return '請輸入檔案名稱';
          if (!/^[A-Za-z0-9_-]+$/.test(targetFilename))  return '檔案名稱僅允許英數字、連字號（-）及底線（_）';
          if (targetFilename.length > 100)                return '檔案名稱不得超過 100 字元';
          if (/[/\\]|\.\./.test(targetFilename))          return '檔案名稱包含不合法字符';

          return null;
        },

        // T018: 以 FileReader 讀取並回傳 base64 字串
        readAsBase64(file) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload  = e => resolve(e.target.result.split(',')[1]);
            reader.onerror = ()  => reject(new Error('讀取檔案失敗'));
            reader.readAsDataURL(file);
          });
        },
      };

      // ============================================================
      // Pure-JS SHA-256 fallback（for non-secure HTTP local dev）
      // crypto.subtle 僅在 HTTPS/localhost 可用；HTTP + 自訂 hostname 需此 fallback
      // ============================================================
      function _sha256Sync(input) {
        // input: Uint8Array → returns Uint8Array (32 bytes)
        const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
        const rr = (v,n) => (v>>>n)|(v<<(32-n));
        let [h0,h1,h2,h3,h4,h5,h6,h7]=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
        const bl = input.length;
        const pad = new Uint8Array(((bl+9+63)&~63));
        pad.set(input); pad[bl]=0x80;
        const dv=new DataView(pad.buffer);
        dv.setUint32(pad.length-4,(bl*8)>>>0,false);
        for(let i=0;i<pad.length;i+=64){
          const w=new Array(64);
          for(let j=0;j<16;j++) w[j]=dv.getUint32(i+j*4,false);
          for(let j=16;j<64;j++){const s0=rr(w[j-15],7)^rr(w[j-15],18)^(w[j-15]>>>3);const s1=rr(w[j-2],17)^rr(w[j-2],19)^(w[j-2]>>>10);w[j]=(w[j-16]+s0+w[j-7]+s1)>>>0;}
          let [a,b,c,d,e,f,g,h]=[h0,h1,h2,h3,h4,h5,h6,h7];
          for(let j=0;j<64;j++){const S1=rr(e,6)^rr(e,11)^rr(e,25);const ch=(e&f)^(~e&g);const t1=(h+S1+ch+K[j]+w[j])>>>0;const S0=rr(a,2)^rr(a,13)^rr(a,22);const maj=(a&b)^(a&c)^(b&c);const t2=(S0+maj)>>>0;[h,g,f,e,d,c,b,a]=[g,f,e,(d+t1)>>>0,c,b,a,(t1+t2)>>>0];}
          h0=(h0+a)>>>0;h1=(h1+b)>>>0;h2=(h2+c)>>>0;h3=(h3+d)>>>0;h4=(h4+e)>>>0;h5=(h5+f)>>>0;h6=(h6+g)>>>0;h7=(h7+h)>>>0;
        }
        const out=new Uint8Array(32);const rv=new DataView(out.buffer);
        [h0,h1,h2,h3,h4,h5,h6,h7].forEach((v,i)=>rv.setUint32(i*4,v,false));
        return out;
      }

      async function _sha256(bytes) {
        if (crypto?.subtle?.digest) {
          return new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
        }
        return _sha256Sync(bytes); // HTTP 本機開發 fallback
      }

      // ============================================================
      // T008–T014: Auth 模組
      // ============================================================
      const Auth = {
        _b64url(bytes) {
          let s = '';
          bytes.forEach(b => (s += String.fromCharCode(b)));
          return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
        },

        // T008: 產生 PKCE 參數
        async generatePKCE() {
          const vBytes = new Uint8Array(64);
          crypto.getRandomValues(vBytes);
          const codeVerifier = this._b64url(vBytes);

          const hash          = await _sha256(new TextEncoder().encode(codeVerifier));
          const codeChallenge = this._b64url(hash);

          const sBytes = new Uint8Array(16);
          crypto.getRandomValues(sBytes);
          const state = Array.from(sBytes).map(b => b.toString(16).padStart(2, '0')).join('');

          return { codeVerifier, codeChallenge, state };
        },

        // T009: 發起 OAuth PKCE 登入 redirect
        async initiateLogin() {
          const { codeVerifier, codeChallenge, state } = await this.generatePKCE();
          sessionStorage.setItem('gl_pkce_verifier', codeVerifier);
          sessionStorage.setItem('gl_oauth_state',   state);

          const params = new URLSearchParams({
            client_id:             CONFIG.CLIENT_ID,
            redirect_uri:          CONFIG.REDIRECT_URI,
            response_type:         'code',
            scope:                 'api',
            state,
            code_challenge:        codeChallenge,
            code_challenge_method: 'S256',
          });
          window.location.href = `${CONFIG.GITLAB_BASE_URL}/oauth/authorize?${params}`;
        },

        // T010: 處理 OAuth callback（解析 URL、交換 token）
        async handleCallback() {
          const params = new URLSearchParams(window.location.search);
          const code   = params.get('code');
          const state  = params.get('state');
          const error  = params.get('error');

          if (!code && !error) return; // 非 callback，直接 return

          // 立即清除 URL 參數
          history.replaceState({}, '', window.location.pathname);

          if (error) {
            UI.setState(APP_STATE.UNAUTHENTICATED);
            UI.showError('登入失敗：GitLab 授權被拒絕，請重試');
            return;
          }

          // CSRF 防護：驗證 state
          const savedState = sessionStorage.getItem('gl_oauth_state');
          if (!savedState || state !== savedState) {
            UI.setState(APP_STATE.UNAUTHENTICATED);
            UI.showError('登入失敗：安全驗證錯誤，請重試');
            return;
          }

          const codeVerifier = sessionStorage.getItem('gl_pkce_verifier');
          // 清除 PKCE 中間狀態
          sessionStorage.removeItem('gl_oauth_state');
          sessionStorage.removeItem('gl_pkce_verifier');

          // Token exchange
          try {
            const body = new URLSearchParams({
              grant_type:    'authorization_code',
              client_id:     CONFIG.CLIENT_ID,
              code,
              redirect_uri:  CONFIG.REDIRECT_URI,
              code_verifier: codeVerifier,
            });
            console.debug('[OAuth] token exchange body:', body.toString());
            const resp = await fetch(`${CONFIG.GITLAB_BASE_URL}/oauth/token`, {
              method:  'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body:    body.toString(),
            });
            if (!resp.ok) {
              const errBody = await resp.json().catch(() => ({}));
              console.error('[OAuth] token exchange failed:', resp.status, errBody);
              throw new Error(`HTTP ${resp.status}`);
            }

            const data = await resp.json();
            sessionStorage.setItem('gl_token', data.access_token);

            await this.fetchCurrentUser();
            UI.setState(APP_STATE.AUTHENTICATED);
          } catch (err) {
            UI.setState(APP_STATE.UNAUTHENTICATED);
            UI.showError(`登入失敗：無法取得 Token（${err.message}），請重試`);
          }
        },

        // T011: 以 access token 取得當前用戶資訊
        async fetchCurrentUser() {
          const data = await GitLabAPI.request('GET', '/api/v4/user');
          currentUser = { username: data.username, name: data.name };
          UI.updateUrlPreview();
          return currentUser;
        },

        // T012: 登出，清除 session
        logout() {
          sessionStorage.removeItem('gl_token');
          sessionStorage.removeItem('gl_pipeline_id');
          currentUser      = null;
          selectedFile     = null;
          selectedFileHash = null;
          UI.setState(APP_STATE.UNAUTHENTICATED);
        },
      };

      // ============================================================
      // T025–T030: PipelinePoller 模組
      // ============================================================
      const PipelinePoller = {
        _intervalId:      null,
        _timeoutId:       null,
        _pipelineId:      null,
        _deployedFilePath: null,
        _fileHash:         null,

        stop() {
          if (this._intervalId) { clearInterval(this._intervalId); this._intervalId = null; }
          if (this._timeoutId)  { clearTimeout(this._timeoutId);   this._timeoutId  = null; }
        },

        // T025: 啟動輪詢
        async start(deployedFilePath, fileHash = '') {
          this._deployedFilePath = deployedFilePath;
          this._fileHash         = fileHash;
          if (fileHash) sessionStorage.setItem('gl_file_hash', fileHash);
          this.stop();

          // 等待 1.5s 讓 pipeline 有時間觸發
          await new Promise(r => setTimeout(r, 1500));

          // 取得最新 pipeline ID（最多重試 3 次，間隔 2 秒）
          let pipeline = null;
          for (let attempt = 0; attempt <= CONFIG.PIPELINE_RETRY_MAX; attempt++) {
            try { pipeline = await GitLabAPI.getLatestPipeline(); } catch (_) {}
            if (pipeline) break;
            if (attempt < CONFIG.PIPELINE_RETRY_MAX) {
              await new Promise(r => setTimeout(r, CONFIG.PIPELINE_RETRY_INTERVAL_MS));
            }
          }

          if (!pipeline) {
            UI.updatePipelineStatus('無法取得 Pipeline 資訊，請至 GitLab 手動確認', '⚠️');
            UI.setPublishBtnDisabled(false);
            return;
          }

          this._pipelineId = pipeline.id;
          sessionStorage.setItem('gl_pipeline_id', String(pipeline.id));
          if (pipeline.web_url) UI.showPipelineLink(pipeline.web_url);

          // 啟動輪詢 + 逾時計時
          this._intervalId = setInterval(() => this.poll(), CONFIG.PIPELINE_POLL_INTERVAL_MS);
          this._timeoutId  = setTimeout(() => this.onTimeout(), CONFIG.PIPELINE_TIMEOUT_MS);
          this.poll(); // 立即執行第一次
        },

        // T030: 從 sessionStorage 恢復輪詢（頁面重新整理後）
        async resumeFromSession() {
          const savedId = sessionStorage.getItem('gl_pipeline_id');
          if (!savedId) return false;

          this._pipelineId = parseInt(savedId, 10);
          this._fileHash   = sessionStorage.getItem('gl_file_hash') || '';
          UI.setState(APP_STATE.POLLING);
          UI.updatePipelineStatus('正在恢復 Pipeline 狀態查詢…', '⏳');

          this._intervalId = setInterval(() => this.poll(), CONFIG.PIPELINE_POLL_INTERVAL_MS);
          this._timeoutId  = setTimeout(() => this.onTimeout(), CONFIG.PIPELINE_TIMEOUT_MS);
          this.poll();
          return true;
        },

        // T026: 輪詢一次
        async poll() {
          if (!this._pipelineId) return;

          let statusData;
          try {
            statusData = await GitLabAPI.getPipelineStatus(this._pipelineId);
          } catch (err) {
            UI.updatePipelineStatus(`無法取得 Pipeline 狀態，重試中…（${err.message}）`, '⚠️');
            return; // 網路錯誤時繼續輪詢
          }

          if (statusData.webUrl) UI.showPipelineLink(statusData.webUrl);

          // Pipeline 狀態 → 中文顯示映射
          const statusMap = {
            created:              '等待中…',
            waiting_for_resource: '等待資源…',
            preparing:            '準備中…',
            pending:              '排隊等待中…',
            running:              '部署中…',
            success:              '部署成功 ✓',
            failed:               '部署失敗 ✗',
            canceled:             '部署已取消',
            skipped:              '部署已略過',
          };
          const iconMap = {
            created: '⏳', waiting_for_resource: '⏳', preparing: '⏳', pending: '⏳',
            running: '🔄', success: '✅', failed: '❌', canceled: '🚫', skipped: '⏭️',
          };
          UI.updatePipelineStatus(
            statusMap[statusData.status] || statusData.status,
            iconMap[statusData.status]   || '⏳'
          );

          // 終止狀態處理
          if (['success', 'failed', 'canceled', 'skipped'].includes(statusData.status)) {
            this.stop();
            sessionStorage.removeItem('gl_pipeline_id');
            sessionStorage.removeItem('gl_file_hash');
            if      (statusData.status === 'success')                         this.onSuccess(this._deployedFilePath);
            else if (statusData.status === 'failed')                          this.onFailed();
            else /* canceled | skipped */                                     this.onCanceled(statusData.status);
          }
        },

        // T027: 部署成功
        onSuccess(deployedFilePath) {
          const filename    = deployedFilePath.split('/').pop().replace(/\.html$/, '');
          const ver         = this._fileHash ? `?v=${this._fileHash}` : '';
          const deployedUrl = `${CONFIG.PAGES_BASE_URL}/${currentUser.username}/${filename}.html${ver}`;
          UI.setState(APP_STATE.DEPLOYED);
          UI.showSuccess('部署成功 ✓', deployedUrl);
          UI.setPublishBtnDisabled(false);
          FileListService.load(); // T022: 部署完成後自動重整清單

          // CDN 輪詢：每 3 秒 fetch HEAD 確認網址是否已生效（非 404）
          const urlEl    = document.getElementById('deployed-url');
          const btnAgain = document.getElementById('btn-publish-again');
          const warmupEl = document.getElementById('cdn-warmup');
          const noteEl   = document.getElementById('cdn-warmup-note');
          // 網址全程顯示，讓使用者可點進去等 CDN 生效後重整
          if (btnAgain) btnAgain.classList.add('hidden');
          if (warmupEl) warmupEl.classList.remove('hidden');
          const successMsg = document.querySelector('#success-box .success-msg');
          if (successMsg) successMsg.innerHTML = '<span class="spinner"></span>正在確認部署是否成功';

          const POLL_INTERVAL_MS = 3000;
          const POLL_TIMEOUT_MS  = 30000;
          const pollStart = Date.now();

          const stopPolling = () => { clearInterval(pollTimer); };

          const pollTimer = setInterval(async () => {
            // 逾時：停止輪詢，顯示友善說明
            if (Date.now() - pollStart >= POLL_TIMEOUT_MS) {
              stopPolling();
              if (noteEl) noteEl.textContent = 'CDN 驗證逾時，建議點擊「再次發布」重試，或稍後直接開啟頁面網址確認是否已生效。';
              if (warmupEl) warmupEl.classList.remove('hidden');
              if (urlEl)    urlEl.classList.add('hidden');
              if (btnAgain) btnAgain.classList.remove('hidden');
              const timeoutMsg = document.querySelector('#success-box .success-msg');
              if (timeoutMsg) { timeoutMsg.textContent = '部署失敗'; timeoutMsg.style.color = 'var(--error)'; }
              return;
            }
            try {
              const res = await fetch(deployedUrl, { method: 'HEAD', cache: 'no-store' });
              if (res.ok) {
                stopPolling();
                // warmup 小字換成生效說明，不整塊隱藏
                if (noteEl)   noteEl.textContent = '頁面可正常開啟，請點擊下方連結。';
                if (urlEl)    urlEl.classList.remove('hidden');
                if (btnAgain) btnAgain.classList.remove('hidden');
                // 大標題換成已生效
                const successMsg = document.querySelector('#success-box .success-msg');
                if (successMsg) successMsg.textContent = '✓ 已生效！';
              }
            } catch (_e) {
              // 網路錯誤或 CORS preflight —— 繼續等待
            }
          }, POLL_INTERVAL_MS);

          // 「再次發布」按鈕重置表單
          document.getElementById('btn-publish-again')?.addEventListener('click', () => {
            stopPolling();
            selectedFile     = null;
            selectedFileHash = null;
            const fi = document.getElementById('file-input');
            const fn = document.getElementById('filename-input');
            if (fi) { fi.value = ''; }
            if (fn) fn.value = '';
            document.getElementById('file-name-display').textContent = '點擊或拖拉 .html / .htm 檔案';
            document.getElementById('success-box')?.classList.add('hidden');
            document.getElementById('pipeline-error-box')?.classList.add('hidden');
            document.getElementById('pipeline-link')?.classList.add('hidden');
            document.getElementById('pipeline-card-title').textContent = '部署中…';
            UI.setState(APP_STATE.AUTHENTICATED);
            UI.updateUrlPreview();
          }, { once: true });
        },

        // T028: 部署失敗 + canceled/skipped（修正 I2）
        onFailed() {
          UI.setState(APP_STATE.DEPLOYMENT_FAILED);
          UI.showPipelineError('部署失敗，請點擊上方「查看 Pipeline 詳情」連結確認錯誤原因。');
          UI.setPublishBtnDisabled(false);
        },

        onCanceled(status) {
          UI.setState(APP_STATE.DEPLOYMENT_FAILED);
          UI.showPipelineError(
            status === 'canceled'
              ? '部署已取消。如需重新發布，請點擊返回後再試。'
              : '部署已略過，請聯繫管理員確認 CI/CD 設定。'
          );
          UI.setPublishBtnDisabled(false);
        },

        // T029: 輪詢逾時
        onTimeout() {
          this.stop();
          sessionStorage.removeItem('gl_pipeline_id');
          UI.setState(APP_STATE.DEPLOYMENT_TIMEOUT);
          UI.showPipelineError('部署逾時（超過 5 分鐘），請至 GitLab 確認 Pipeline 狀態，或聯繫管理員。');
          UI.setPublishBtnDisabled(false);
        },
      };

      // ============================================================
      // T007: FileListService 模組
      // ============================================================
      const FileListService = {
        // T008: 載入已發布檔案清單
        async load() {
          const username = currentUser?.username;
          if (!username) return;
          UI.setFileListLoading(true);
          try {
            const items = await GitLabAPI.listFiles(username);
            const files = items
              .slice(0, 20)
              .map(i => ({
                filename:        i.name,
                filePath:        i.path,
                encodedFilePath: encodeFilePath(i.path),
                pageUrl:         `${CONFIG.PAGES_BASE_URL}/${username}/${i.name}`,
              }));
            UI.renderFileList(files);
          } catch (err) {
            UI.showFileListError('無法載入清單，請重新整理頁面');
          } finally {
            UI.setFileListLoading(false);
          }
        },

        // T014: 複製連結（Clipboard API + fallback）
        async copyUrl(pageUrl) {
          try {
            await navigator.clipboard.writeText(pageUrl);
            return true;
          } catch (_) {
            // Fallback: 隱藏 textarea + execCommand
            try {
              const ta = document.createElement('textarea');
              ta.value = pageUrl;
              ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';
              document.body.appendChild(ta);
              ta.select();
              const ok = document.execCommand('copy');
              document.body.removeChild(ta);
              return ok;
            } catch (_) {
              return false;
            }
          }
        },

        // T017: 刪除檔案主流程（DELETE + triggerPipeline）
        async deleteFile(filePath, filename) {
          try {
            await GitLabAPI.deleteFile(filePath);
            await GitLabAPI.triggerPipeline();
            UI.removeFileRow(filePath);
            UI.showToast(`已成功刪除 ${filename}`);
          } catch (err) {
            if (err.code === 401) {
              Auth.logout();
              UI.showError('登入已過期，請重新登入');
            } else {
              UI.showToast(err.message || '刪除失敗，請稍後再試', 'error');
              UI.setRowDeleting(filePath, false);
            }
          }
        },
      };

      // ============================================================
      // T016, T017: 表單事件綁定
      // ============================================================
      function bindFormEvents() {
        const fileInput     = document.getElementById('file-input');
        const filenameInput = document.getElementById('filename-input');
        const fileNameDisplay = document.getElementById('file-name-display');

        // T016: 選擇檔案後自動填入名稱
        fileInput?.addEventListener('change', async e => {
          selectedFile     = e.target.files[0] || null;
          selectedFileHash = null;
          if (fileNameDisplay) {
            fileNameDisplay.textContent = selectedFile ? selectedFile.name : '點擊或拖拉 .html / .htm 檔案';
          }
          if (selectedFile && filenameInput && !filenameInput.value.trim()) {
            // 取最後一個 . 前的部分作為預設名稱（修正 U3）
            const dotIdx = selectedFile.name.lastIndexOf('.');
            filenameInput.value = dotIdx > 0
              ? selectedFile.name.substring(0, dotIdx)
              : selectedFile.name;
          }
          if (selectedFile) {
            try {
              const b64 = await FileOp.readAsBase64(selectedFile);
              const hb  = await _sha256(new TextEncoder().encode(b64));
              selectedFileHash = Array.from(hb.slice(0, 2)).map(b => b.toString(16).padStart(2, '0')).join('');
            } catch (_) { selectedFileHash = null; }
          }
          UI.updateUrlPreview();
          UI.clearValidationError();
          UI._refreshPublishBtn();
        });

        // T017: 即時更新 URL 預覽並驗證名稱
        filenameInput?.addEventListener('input', () => {
          UI.updateUrlPreview();
          const val = filenameInput.value.trim();
          if (val && !/^[A-Za-z0-9_-]+$/.test(val)) {
            UI.showValidationError('僅允許英數字、連字號（-）及底線（_）');
          } else {
            UI.clearValidationError();
          }
          UI._refreshPublishBtn();
        });
      }

      // ============================================================
      // T021, T031: handlePublish — 發布主流程
      // ============================================================
      async function handlePublish() {
        const targetFilename = document.getElementById('filename-input')?.value.trim() || '';

        // Step 1: 前端驗證
        const validationErr = FileOp.validate(selectedFile, targetFilename);
        if (validationErr) { UI.showValidationError(validationErr); return; }
        UI.clearValidationError();
        UI.clearError();

        // 確認已登入
        if (!currentUser?.username) { UI.showError('請重新登入後再試'); return; }

        // T031: Defence-in-depth 路徑注入防護
        // targetPath 格式: public/{username}/{filename}.html
        const targetPath    = `${CONFIG.PUBLIC_DIR_PREFIX}/${currentUser.username}/${targetFilename}.html`;
        const pathUsername  = targetPath.split('/')[1];
        if (pathUsername !== currentUser.username) {
          // 理論上不可能發生，但作為安全強化層確保路徑前綴與 token 持有者一致
          UI.showError('路徑驗證失敗，請重新登入後再試');
          return;
        }

        // Step 2: 禁用按鈕，切換至上傳狀態
        UI.setPublishBtnDisabled(true);
        UI.setState(APP_STATE.UPLOADING);
        UI.updatePipelineStatus('正在讀取檔案…', '⏳');

        // 切換至 pipeline section 顯示進度
        UI.setState(APP_STATE.POLLING);

        try {
          // Step 3: 讀取 base64
          UI.updatePipelineStatus('正在讀取檔案…', '⏳');
          const base64Content = await FileOp.readAsBase64(selectedFile);
          const fileHash = selectedFileHash || '';

          // Step 4: 確認目標檔案是否存在
          UI.updatePipelineStatus('正在確認目標路徑…', '⏳');
          const existsResult = await GitLabAPI.checkFileExists(targetPath);
          const operation    = existsResult.exists ? 'update' : 'create';
          const lastCommitId = existsResult.lastCommitId || null;

          // Step 5: Commit 檔案
          UI.updatePipelineStatus(
            `正在提交檔案（${operation === 'create' ? '新增' : '更新'}）…`, '⏳'
          );
          await GitLabAPI.commitFile(targetPath, base64Content, operation, lastCommitId, currentUser.username);

          // Step 6: 進入輪詢
          UI.updatePipelineStatus('正在等待 Pipeline 啟動…', '⏳');
          PipelinePoller.start(targetPath, fileHash);

        } catch (err) {
          if (err.code === 401) {
            Auth.logout();
            // 切回登入頁並顯示錯誤
            UI.showError('登入已過期，請重新登入');
          } else if (err.code === 403) {
            UI.setState(APP_STATE.AUTHENTICATED);
            UI.showError('權限不足，請聯繫管理員開通發布權限');
            UI.setPublishBtnDisabled(false);
          } else {
            UI.setState(APP_STATE.AUTHENTICATED);
            UI.showError(err.message || '發布失敗，請重試');
            UI.setPublishBtnDisabled(false);
          }
        }
      }

      // ============================================================
      // T014: DOMContentLoaded — 頁面初始化
      // ============================================================
      document.addEventListener('DOMContentLoaded', async () => {
        // 靜態事件綁定
        document.getElementById('btn-login')?.addEventListener('click', () => Auth.initiateLogin());
        document.getElementById('btn-logout')?.addEventListener('click', () => Auth.logout());
        document.getElementById('btn-publish')?.addEventListener('click', handlePublish);
        bindFormEvents();

        // 先處理 OAuth callback（若是從 GitLab redirect 回來）
        await Auth.handleCallback();

        // 若 handleCallback 已完成登入（設定了 currentUser），則無需再處理
        if (currentUser) return;

        // 嘗試以 sessionStorage 中的 token 恢復登入狀態
        const token = sessionStorage.getItem('gl_token');
        if (token) {
          try {
            await Auth.fetchCurrentUser();
            // 檢查是否有待恢復的 pipeline
            if (sessionStorage.getItem('gl_pipeline_id')) {
              await PipelinePoller.resumeFromSession();
            } else {
              UI.setState(APP_STATE.AUTHENTICATED);
            }
          } catch (_) {
            // Token 已失效，清除並回到未登入狀態
            sessionStorage.removeItem('gl_token');
            UI.setState(APP_STATE.UNAUTHENTICATED);
          }
        } else {
          UI.setState(APP_STATE.UNAUTHENTICATED);
        }
      });
    </script>
  </body>
</html>
