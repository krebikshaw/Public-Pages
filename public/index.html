<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>25SPROUT NBU Pages</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg: #0d1117; --surface: #161b22; --border: #30363d;
        --accent: #4f9cf9; --text: #e6edf3; --text-muted: #8b949e;
        --radius: 8px;
      }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      .bg-glow { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .bg-glow::before { content: ''; position: absolute; top: -10%; left: 25%; width: 600px; height: 600px; background: radial-gradient(circle, rgba(79,156,249,.1) 0%, transparent 70%); border-radius: 50%; }
      .page { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 0 24px 80px; }
      .nav { display: flex; align-items: center; gap: 12px; padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 60px; }
      .nav-logo { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--text-muted); text-transform: uppercase; }
      .nav-pill { background: rgba(79,156,249,.12); color: var(--accent); border: 1px solid rgba(79,156,249,.25); border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
      .hero { margin-bottom: 60px; }
      .hero-kicker { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
      .hero h1 { font-size: 36px; font-weight: 700; line-height: 1.2; margin-bottom: 16px; }
      .hero h1 strong { background: linear-gradient(135deg, var(--text), #79b4fb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
      .hero p { color: var(--text-muted); font-size: 16px; max-width: 480px; }
      .tools { display: grid; gap: 16px; }
      .tool-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; display: flex; align-items: flex-start; gap: 16px; text-decoration: none; color: inherit; transition: border-color .15s, transform .1s; }
      .tool-card:hover { border-color: var(--accent); transform: translateY(-1px); }
      .tool-icon { font-size: 28px; flex-shrink: 0; }
      .tool-body h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
      .tool-body p { font-size: 14px; color: var(--text-muted); line-height: 1.5; }
      .tool-badge { display: inline-block; background: rgba(79,156,249,.12); color: var(--accent); border: 1px solid rgba(79,156,249,.25); border-radius: 4px; font-size: 11px; font-weight: 600; padding: 1px 6px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div class="bg-glow"></div>
    <div class="page">
      <nav class="nav">
        <span class="nav-logo">25SPROUT NBU</span>
        <span class="nav-pill">Pages</span>
      </nav>
      <section class="hero">
        <div class="hero-kicker">Internal Resources</div>
        <h1>25SPROUT NBU<br /><strong>內部文件與資源中心</strong></h1>
        <p>透過 GitHub Pages 發佈的靜態頁面集合。</p>
      </section>
    </div>
  </body>
</html>
