<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台南美食景點清單</title>
<style>
:root{
  --bg:#f7f5f1; --panel:#ffffff; --ink:#1f2328; --muted:#6a7078; --line:#e3ded5;
  --accent:#c2410c; --accent-soft:#fdeadd; --chip:#f0ece4; --chip-on:#c2410c; --chip-on-ink:#fff;
  --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16140f; --panel:#201d17; --ink:#ece8df; --muted:#9b958a; --line:#3a352b;
    --accent:#fb923c; --accent-soft:#3a2415; --chip:#2c281f; --chip-on:#fb923c; --chip-on-ink:#1a1308;
    --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --shadow:none}
}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 8px}
.row1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0 6px 0 0;white-space:nowrap}
#q{flex:1 1 220px;min-width:160px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-size:14px}
.count{color:var(--muted);white-space:nowrap}
.count b{color:var(--ink);font-size:16px}
select,button.btn{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-size:13px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--ink);padding:7px 12px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--accent);color:var(--chip-on-ink)}
.filters{padding:10px 16px 4px;background:var(--bg)}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.grp>label.t{width:64px;color:var(--muted);font-size:12px;flex:none}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:4px 11px;border-radius:999px;cursor:pointer;font-size:13px;user-select:none}
.chip small{color:var(--muted);margin-left:3px}
.chip.on{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-ink)}
.chip.on small{color:inherit;opacity:.85}
.chip.zero{opacity:.38}
.presets .chip{background:var(--accent-soft);border-color:transparent}
.toggles{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:2px 0 6px;color:var(--ink)}
.toggles label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
main{padding:6px 16px 60px}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:auto;max-height:none}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1180px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{position:sticky;top:0;background:var(--panel);z-index:5;font-size:12px;color:var(--muted);white-space:nowrap;cursor:pointer}
th.nosort{cursor:default}
tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
tr.done td{opacity:.55}
tr.closed td{background:color-mix(in srgb,var(--bad) 7%,transparent)}
td.name{min-width:190px;font-weight:600}
td.tags{min-width:150px}
td.desc{min-width:240px;max-width:380px}
td.hours{min-width:170px;font-size:13px}
td.addr{min-width:170px;font-size:13px;color:var(--muted)}
.tag{display:inline-block;background:var(--chip);border-radius:6px;padding:0 6px;margin:1px 2px 1px 0;font-size:12px;cursor:pointer;color:var(--ink)}
.tag.yh{background:#fde68a;color:#78350f}.tag.ig{background:#fbcfe8;color:#831843}
.tag:hover{outline:1px solid var(--accent)}
.ig-note{display:block;margin-top:5px;padding:5px 8px;font-size:13px;border-radius:8px;background:var(--accent-soft);border-left:3px solid var(--accent)}
.ig-note .h{color:var(--muted);font-size:12px}
.yh-note{font-weight:500}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--chip);flex:none;cursor:zoom-in;display:block}
.thumb.empty{cursor:default}
td.name .nm{display:flex;gap:10px;align-items:flex-start}
.gal{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:4px;height:210px;border-radius:10px;overflow:hidden;margin:-2px 0 2px;background:var(--chip)}
.gal.one{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.gal img{width:100%;height:100%;min-height:0;min-width:0;object-fit:cover;display:block;cursor:zoom-in}
.gal img:first-child{grid-row:1/3}
.gal.one img:first-child{grid-row:auto}
.gal.two{grid-template-rows:minmax(0,1fr)}
.gal.two img:first-child{grid-row:auto}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:60;cursor:zoom-out}
.lb.show{display:flex}.lb img{max-width:94vw;max-height:90vh;border-radius:8px}
.open-now{color:var(--ok);font-weight:600}.closed-now{color:var(--muted)}
.rate{white-space:nowrap}
.mapbtn{display:inline-block;padding:3px 9px;border:1px solid var(--accent);border-radius:8px;font-size:13px;white-space:nowrap}
input.note{width:100%;min-width:130px;border:1px solid transparent;border-bottom:1px dashed var(--line);background:transparent;color:var(--ink);padding:3px 4px;font:inherit}
input.note:focus{outline:none;border-color:var(--accent);background:var(--panel)}
input[type=checkbox].go{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.card.done{opacity:.6}.card.closed{border-color:var(--bad)}
.card h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:flex-start}
.card .meta{color:var(--muted);font-size:13px}
.card .kv{font-size:13px}.card .kv b{color:var(--muted);font-weight:500;margin-right:4px}
.card .foot{display:flex;gap:8px;align-items:center;margin-top:auto;flex-wrap:wrap}
.empty{padding:50px;text-align:center;color:var(--muted)}
.secH{grid-column:1/-1;font-size:15px;font-weight:700;margin:12px 0 0}
tr.secrow td{background:var(--bg);font-weight:700;font-size:14px;position:static}
footer{color:var(--muted);font-size:12px;padding:0 16px 40px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
@media (max-width:760px){h1{font-size:16px}.grp>label.t{width:100%}}
</style>
</head>
<body>
<header class="top">
  <div class="row1">
    <h1>🍜 台南美食景點清單</h1>
    <input id="q" type="search" placeholder="搜尋店名、標籤、地址、說明…（例：牛肉湯、#宵夜、安平）">
    <span class="count">符合 <b id="cnt">0</b> / <span id="tot">0</span></span>
    <select id="sort" title="排序">
      <option value="def">排序：預設（妤舫→IG→區域）</option>
      <option value="rate">評分高→低</option>
      <option value="rev">評論數多→少</option>
      <option value="name">店名</option>
      <option value="dist">區域</option>
    </select>
    <span class="seg" id="view"><button data-v="table" class="on">表格</button><button data-v="cards">卡片</button></span>
    <button class="btn" id="reset">清除篩選</button>
  </div>
</header>

<section class="filters">
  <div class="grp presets"><label class="t">快速組合</label><span id="presets"></span></div>
  <div class="grp"><label class="t">用餐時段</label><span id="g-meal"></span></div>
  <div class="grp"><label class="t">區域</label><span id="g-dist"></span></div>
  <div class="grp"><label class="t">類型</label><span id="g-type"></span></div>
  <div class="grp"><label class="t">來源</label><span id="g-src"></span></div>
  <div class="toggles">
    <label><input type="checkbox" id="t-open"> 現在營業中</label>
    <label><input type="checkbox" id="t-today"> 今天有營業</label>
    <label><input type="checkbox" id="t-checked"> 只看已勾選「去」</label>
    <label><input type="checkbox" id="t-unchecked"> 隱藏已勾選</label>
    <label>評分 ≥ <select id="minr"><option value="0">不限</option><option>3.5</option><option>4</option><option>4.3</option><option>4.5</option><option>4.7</option></select></label>
    <label><input type="checkbox" id="t-group" checked> 依時段分組顯示</label>
    <span style="margin-left:auto;display:flex;gap:6px">
      <button class="btn" id="copy">複製已勾選清單</button>
      <button class="btn" id="exp">匯出勾選／備註</button>
      <button class="btn" id="imp">匯入</button>
    </span>
  </div>
</section>

<main>
  <div id="out"></div>
</main>
<footer>
  資料擷取日 2026-10-23｜營業時間、評分、價格為擷取當下的 Google 地圖資料，出發前請點「地圖」再確認。<br>
  「去」勾選與「備註」只存在這台電腦的瀏覽器裡；要和旁邊的人同步，請用右上「匯出／匯入」交換，或一起看同一個畫面。
</footer>
<div class="toast" id="toast"></div>
<div class="lb" id="lb"><img id="lbimg" alt=""></div>
<input type="file" id="file" accept="application/json" hidden>

  else if(F.sort==='rev') a.sort((x,y)=>(y.rev||0)-(x.rev||0)||base(x,y));
  else if(F.sort==='name') a.sort((x,y)=>x.name.localeCompare(y.name,'zh-Hant'));
  else if(F.sort==='dist') a.sort((x,y)=>(DIST_ORDER.indexOf(x.dist)+100)%100-(DIST_ORDER.indexOf(y.dist)+100)%100||base(x,y));
  else a.sort(base);
  return a;
}

/* ---------- 畫面 ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function chipRow(host, items, set, key){
  host.innerHTML='';
  items.forEach(it=>{
    const c=document.createElement('span'); c.className='chip'+(set.has(it.v)?' on':'')+(it.n===0&&!set.has(it.v)?' zero':'');
    c.innerHTML=esc(it.label||it.v)+'<small>'+it.n+'</small>';
    c.onclick=()=>{ set.has(it.v)?set.delete(it.v):set.add(it.v); render(); };
    host.appendChild(c);
  });
}
const IMGBASE='https://lh3.googleusercontent.com/';
const imgUrl=(p,sz)=>IMGBASE+p+'='+sz;
function thumbHTML(r){ return r.imgs&&r.imgs.length? '<img class="thumb" loading="lazy" referrerpolicy="no-referrer" src="'+imgUrl(r.imgs[0],'w160-h160-c')+'" data-big="'+imgUrl(r.imgs[0],'w1200-h900')+'" onerror="this.style.visibility=\'hidden\'">' : '<span class="thumb empty"></span>'; }
function galHTML(r){
  if(!r.imgs||!r.imgs.length) return '';
  const im=r.imgs.slice(0,3), n=im.length;
  return '<div class="gal '+(n===1?'one':n===2?'two':'')+'">'+im.map((p,i)=>'<img loading="lazy" referrerpolicy="no-referrer" src="'+imgUrl(p,i===0?'w800-h520-c':'w400-h300-c')+'" data-big="'+imgUrl(p,'w1200-h900')+'" onerror="this.style.display=\'none\'">').join('')+'</div>';
}
function descHTML(r){
  const parts=[];
  if(r.yh) parts.push('<div class="yh-note">'+esc(r.yh)+'</div>');
  r.ig.forEach(i=>parts.push('<span class="ig-note"><span class="h">📷 IG '+esc(i.h)+'</span><br>'+esc(i.t)+' <a href="'+esc(i.u)+'" target="_blank" rel="noopener">看貼文</a></span>'));
  if(!parts.length && r.blurb) parts.push('<div>'+esc(r.blurb)+'</div>');
  return parts.join('');
}
function tagsHTML(r){
  return r.tags.map(t=>'<span class="tag'+(t==='#妤舫推薦'?' yh':t==='#IG推薦'?' ig':'')+'" data-tag="'+esc(t.slice(1))+'">'+esc(t)+'</span>').join('');
}
function hoursHTML(r){
  let s='';
  const st=openState(r);
  if(st==='open') s+='<div class="open-now">● 營業中</div>'; else if(st==='closed') s+='<div class="closed-now">○ 目前休息</div>';
  return s+esc(r.hours||'（Maps 未提供，請看社群）');
}
function socialHTML(r){ return r.social.map(s=>'<a href="'+esc(s.u)+'" target="_blank" rel="noopener">'+esc(s.l)+'</a>').join(' '); }
function rateHTML(r){ return r.rate? '⭐'+r.rate.toFixed(1)+' <span style="color:var(--muted)">('+r.rev.toLocaleString()+')</span>':''; }

function rowHTML(r){
  const go=!!saved.go[r.id];
  return '<tr class="'+(go?'done ':'')+(r.closed?'closed':'')+'" data-id="'+r.id+'">'
   +'<td><input type="checkbox" class="go" '+(go?'checked':'')+'></td>'
   +'<td class="name"><div class="nm">'+thumbHTML(r)+'<div>'+esc(r.name)+'</div></div>'+(r.note?'<div style="font-weight:400;color:var(--warn);font-size:12px">'+esc(r.note)+'</div>':'')+'</td>'
   +'<td class="tags">'+tagsHTML(r)+'</td>'
   +'<td class="desc">'+descHTML(r)+'</td>'
   +'<td class="hours">'+hoursHTML(r)+'</td>'
   +'<td>'+esc(r.price)+'</td>'
   +'<td class="rate">'+rateHTML(r)+'</td>'
   +'<td class="addr">'+esc(r.addr)+'</td>'
   +'<td><a class="mapbtn" href="'+esc(r.map)+'" target="_blank" rel="noopener">📍 地圖</a></td>'
   +'<td>'+socialHTML(r)+'</td>'
   +'<td><input class="note" placeholder="備註…" value="'+esc(saved.note[r.id]||'')+'"></td></tr>';
}
function cardHTML(r){
  const go=!!saved.go[r.id];
  return '<div class="card '+(go?'done ':'')+(r.closed?'closed':'')+'" data-id="'+r.id+'">'
   +galHTML(r)
   +'<h3><input type="checkbox" class="go" '+(go?'checked':'')+'><span>'+esc(r.name)+'</span></h3>'
   +'<div>'+tagsHTML(r)+'</div>'
   +(descHTML(r)?'<div class="kv">'+descHTML(r)+'</div>':'')
   +'<div class="kv"><b>營業</b>'+hoursHTML(r)+'</div>'
   +'<div class="kv"><b>價格</b>'+esc(r.price)+' <span class="rate" style="margin-left:8px">'+rateHTML(r)+'</span></div>'
   +'<div class="kv meta">'+esc(r.addr)+'</div>'
   +(r.note?'<div class="kv" style="color:var(--warn)">'+esc(r.note)+'</div>':'')
   +'<div class="foot"><a class="mapbtn" href="'+esc(r.map)+'" target="_blank" rel="noopener">📍 地圖</a>'+socialHTML(r)+'</div>'
   +'<input class="note" placeholder="備註…" value="'+esc(saved.note[r.id]||'')+'"></div>';
}
const TH=[['去',0],['店名','name'],['標籤',0],['簡短說明',0],['營業時間',0],['價格',0],['⭐Google','rate'],['地址','dist'],['地圖',0],['社群・食記',0],['備註',0]];
function tableHTML(list, showSecHeads){
  let h='<div class="tablewrap"><table><thead><tr>'+TH.map(([t,k])=>'<th class="'+(k?'':'nosort')+'" '+(k?'data-sort="'+k+'"':'')+'>'+t+'</th>').join('')+'</tr></thead><tbody>';
  if(showSecHeads){
    SECTION_ORDER.forEach(m=>{ const rs=list.filter(r=>r.sec===m); if(!rs.length) return;
      h+='<tr class="secrow"><td colspan="11">'+MEAL_ICON[m]+' '+m+'（'+rs.length+'）</td></tr>'+rs.map(rowHTML).join(''); });
    const rest=list.filter(r=>!SECTION_ORDER.includes(r.sec)); if(rest.length) h+='<tr class="secrow"><td colspan="11">其他</td></tr>'+rest.map(rowHTML).join('');
  } else h+=list.map(rowHTML).join('');
  return h+'</tbody></table></div>';
}
function cardsHTML(list, showSecHeads){
  let h='<div class="cards">';
  if(showSecHeads){
    SECTION_ORDER.forEach(m=>{ const rs=list.filter(r=>r.sec===m); if(!rs.length) return; h+='<div class="secH">'+MEAL_ICON[m]+' '+m+'（'+rs.length+'）</div>'+rs.map(cardHTML).join(''); });
  } else h+=list.map(cardHTML).join('');
  return h+'</div>';
}

const PRESETS=[
  ['只看早午餐',{meal:['早午餐']}],['只看晚餐',{meal:['晚餐']}],['宵夜',{meal:['宵夜']}],
  ['中西區點心',{meal:['點心'],dist:['中西區']}],['北區飲料',{meal:['飲料'],dist:['北區']}],
  ['牛肉湯',{type:['牛肉湯']}],['妤舫推薦',{src:['妤舫推薦']}],['IG推薦的住宿',{meal:['住宿'],src:['IG推薦']}],['景點',{meal:['景點']}]
];
function applyPreset(p){ ['meal','dist','type','src'].forEach(k=>F[k]=new Set(p[k]||[])); F.q=''; $('q').value=''; render(); }

function render(){
  const list=sorted(DATA.filter(r=>match(r)));
  // 時段分組：每筆放進第一個符合篩選的時段區塊，避免同一家店重複出現
  list.forEach(r=>{ r.sec = SECTION_ORDER.find(m=>F.meal.has(m)&&r.mt.includes(m)) || r.primary; });
  $('cnt').textContent=list.length; $('tot').textContent=DATA.filter(r=>F.closed||!r.closed).length;
  // chips 計數（排除自己這一組的條件）
  const cnt=(skip,f)=>DATA.filter(r=>match(r,skip)&&f(r)).length;
  chipRow($('g-meal'), MEALS.map(m=>({v:m,label:MEAL_ICON[m]+' '+m,n:cnt('meal',r=>r.mt.includes(m))})), F.meal,'meal');
  const dists=[...new Set(DATA.map(r=>r.dist))].sort((a,b)=>(DIST_ORDER.indexOf(a)<0?99:DIST_ORDER.indexOf(a))-(DIST_ORDER.indexOf(b)<0?99:DIST_ORDER.indexOf(b)));
  chipRow($('g-dist'), dists.map(d=>({v:d,n:cnt('dist',r=>r.dist===d)})), F.dist,'dist');
  const types=['牛肉湯','小吃','麵食','火鍋燒烤','羊肉爐','海鮮','日式','異國料理','中式','私廚','素食'];
  chipRow($('g-type'), types.map(t=>({v:t,n:cnt('type',r=>r.types.includes(t))})), F.type,'type');
  chipRow($('g-src'), [['妤舫推薦',r=>r.yh],['IG推薦',r=>r.ig.length],['其他',r=>!r.yh&&!r.ig.length]].map(([v,f])=>({v,n:cnt('src',f)})), F.src,'src');
  const showSec = F.group && F.sort==='def';
  $('out').innerHTML = !list.length ? '<div class="empty">沒有符合的項目，試試「清除篩選」</div>' : (F.view==='cards'? cardsHTML(list,showSec) : tableHTML(list,showSec));
  document.querySelectorAll('#view button').forEach(b=>b.classList.toggle('on',b.dataset.v===F.view));
}
function renderPresets(){
  const host=$('presets'); host.innerHTML='';
  PRESETS.forEach(([l,p])=>{ const c=document.createElement('span'); c.className='chip'; c.textContent=l; c.onclick=()=>applyPreset(p); host.appendChild(c); });
}

/* ---------- 事件 ---------- */
let qT; $('q').oninput=e=>{ clearTimeout(qT); qT=setTimeout(()=>{F.q=e.target.value.trim(); render();},120); };
$('sort').onchange=e=>{F.sort=e.target.value; render();};
$('minr').onchange=e=>{F.minr=+e.target.value; render();};
[['t-open','open'],['t-today','today'],['t-checked','checked'],['t-unchecked','unchecked'],['t-group','group']].forEach(([id,k])=>$(id).onchange=e=>{F[k]=e.target.checked; render();});
document.querySelectorAll('#view button').forEach(b=>b.onclick=()=>{F.view=b.dataset.v; render();});
$('reset').onclick=()=>{ ['meal','dist','type','src'].forEach(k=>F[k]=new Set()); F.q=''; $('q').value=''; F.open=F.today=F.checked=F.unchecked=false; F.minr=0; $('minr').value='0'; ['t-open','t-today','t-checked','t-unchecked'].forEach(i=>$(i).checked=false); render(); };
$('out').addEventListener('click',e=>{
  const im=e.target.closest('img[data-big]'); if(im){ $('lbimg').src=im.dataset.big; $('lb').classList.add('show'); return; }
  const tag=e.target.closest('.tag'); if(tag){ const t=tag.dataset.tag; $('q').value='#'+t; F.q='#'+t; render(); return; }
  const th=e.target.closest('th[data-sort]'); if(th){ F.sort=th.dataset.sort; $('sort').value=F.sort; render(); }
});
$('out').addEventListener('change',e=>{
  if(!e.target.classList.contains('go')) return;
  const id=e.target.closest('[data-id]').dataset.id; if(e.target.checked) saved.go[id]=1; else delete saved.go[id]; persist();
  const el=e.target.closest('[data-id]'); el.classList.toggle('done',e.target.checked);
  if(F.checked||F.unchecked) render();
});
$('out').addEventListener('input',e=>{
  if(!e.target.classList.contains('note')) return;
  const id=e.target.closest('[data-id]').dataset.id; const v=e.target.value; if(v) saved.note[id]=v; else delete saved.note[id]; persist();
});
$('lb').onclick=()=>$('lb').classList.remove('show'); document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('lb').classList.remove('show'); });
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
$('copy').onclick=()=>{
  const rs=DATA.filter(r=>saved.go[r.id]); if(!rs.length){ toast('還沒有勾選任何項目'); return; }
  const txt=rs.map(r=>'☑ '+r.name+'｜'+r.sec0+'｜'+r.dist+'｜'+(r.hours||'營業時間未提供')+'｜'+r.map+(saved.note[r.id]?'｜'+saved.note[r.id]:'')).join('\n');
  navigator.clipboard.writeText(txt).then(()=>toast('已複製 '+rs.length+' 筆'),()=>toast('複製失敗，請改用匯出'));
};
$('exp').onclick=()=>{
  const blob=new Blob([JSON.stringify({go:saved.go,note:saved.note},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='台南清單-勾選與備註.json'; a.click(); toast('已匯出');
};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const j=JSON.parse(rd.result); Object.assign(saved.go,j.go||{}); Object.assign(saved.note,j.note||{}); persist(); render(); toast('已合併匯入'); }catch(err){ toast('檔案格式不正確'); } };
  rd.readAsText(f); e.target.value='';
};

DATA.forEach((r,i)=>{ r.ord=i; r.sec0=r.primary; });
renderPresets(); render();
setInterval(()=>{ if(F.open && document.activeElement.tagName!=='INPUT') render(); }, 60000);
</script>
